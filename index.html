<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estrela do amanhã</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Alice&family=Archivo:ital,wght@0,100..900;1,100..900&family=Poppins:wght@400;600;700;800&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

</head>
<body>
    <div id="app">
        <main>
            <div class="container">
                <div class="back">
                    <img src="assets/icons/arrow-left-02.svg" alt="sinal de voltar">
                    <span>voltar</span>
                </div>    
                <div class="form-header">
                    <h1>Formulário de matrícula</h1>
                    <p>Preencha os campos abaixo para se matricular na escola infantil Estrela do Amanhã</p>
                </div>
            </div>
        </main>

        <aside>
            <div class="aside-container">
                <header>
                    <img src="assets/img/Frame 48095956.svg" alt="Logo, estrla do amanhã">
                    <h2>Porque cada momento de 
                    <span>
                        aprendizado
                    </span>
                    conta
                    </h2>
                    <p>Inscreva seu filho em nossa escola e veja-o florescer em um ambiente acolhedor, seguro e estimulante.</p>
                </header>
                <img src="assets/img/Illustration.svg" alt="Ilustração de crianças e ma professora estudando">
            </div>
        </aside>
    </div>

</html>
